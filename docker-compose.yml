services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: radar_tech
      POSTGRES_USER: radar_tech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar_tech_local}
    volumes:
      - radar-tech-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar_tech -d radar_tech"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/radar_tech
      SPRING_DATASOURCE_USERNAME: radar_tech
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-radar_tech_local}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-locally}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-<google-client-id>}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-<google-client-secret>}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-1025}
      PASSWORD_RESET_EMAIL_ENABLED: ${PASSWORD_RESET_EMAIL_ENABLED:-false}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_MONTHLY_PRICE_ID: ${STRIPE_MONTHLY_PRICE_ID:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  radar-tech-data:
