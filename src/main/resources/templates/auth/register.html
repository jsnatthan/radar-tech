<!DOCTYPE html>
<html th:replace="~{fragments/layout :: shell('Cadastro', ~{::div})}" xmlns:th="http://www.thymeleaf.org">
<div class="auth-shell">
    <section class="card card-elevated auth-card">
        <span class="badge badge-success">Conta gratuita</span>
        <h1>Criar conta</h1>
        <p class="u-muted">Use sua conta para acompanhar candidaturas internas e acessar sua �rea pessoal.</p>

        <div class="auth-options">
            <a class="btn-google" th:href="@{/oauth2/authorization/google}" aria-label="Cadastrar com Google">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path fill="#4285F4" d="M23.49 12.27c0-.82-.07-1.6-.21-2.36H12v4.46h6.45a5.52 5.52 0 0 1-2.39 3.62v2.96h3.87c2.26-2.08 3.56-5.14 3.56-8.68z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.94-2.9l-3.87-2.96c-1.07.72-2.44 1.14-4.07 1.14-3.13 0-5.78-2.11-6.72-4.95H1.29v3.06A11.99 11.99 0 0 0 12 24z"/>
                    <path fill="#FBBC05" d="M5.28 14.33a7.2 7.2 0 0 1 0-4.66V6.61H1.29a11.99 11.99 0 0 0 0 10.78l3.99-3.06z"/>
                    <path fill="#EA4335" d="M12 4.72c1.76 0 3.34.6 4.58 1.79l3.44-3.44A11.52 11.52 0 0 0 12 0 11.99 11.99 0 0 0 1.29 6.61l3.99 3.06C6.22 6.83 8.87 4.72 12 4.72z"/>
                </svg>
                <span>Cadastrar com Google</span>
            </a>
        </div>

        <div class="auth-divider">ou</div>

        <form class="js-loading-submit" th:action="@{/cadastro}" th:object="${form}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="alert alert-error u-mb-4" role="alert" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}">Erro</div>

            <div class="form-field">
                <label for="name">Nome (obrigat�rio)</label>
                <input id="name" autocomplete="name" required maxlength="140" class="input" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" th:field="*{name}" placeholder="Seu nome" th:attr="aria-invalid=${#fields.hasErrors('name')},aria-describedby=${#fields.hasErrors('name')} ? 'register-name-error' : null">
                <span id="register-name-error" class="form-field__error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </div>
            <div class="form-field">
                <label for="email">E-mail (obrigat�rio)</label>
                <input id="email" type="email" autocomplete="email" required maxlength="190" class="input" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" th:field="*{email}" placeholder="seu.email@exemplo.com" th:attr="aria-invalid=${#fields.hasErrors('email')},aria-describedby=${#fields.hasErrors('email')} ? 'register-email-error' : null">
                <span id="register-email-error" class="form-field__error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>
            <div class="form-field">
                <label for="username">Usu�rio (opcional)</label>
                <input id="username" autocomplete="username" maxlength="80" class="input" th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''" th:field="*{username}" placeholder="opcional" th:attr="aria-invalid=${#fields.hasErrors('username')},aria-describedby=${#fields.hasErrors('username')} ? 'register-username-error' : null">
                <span id="register-username-error" class="form-field__error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
            </div>
            <div class="form-field">
                <label for="password">Senha (m�nimo de 8 caracteres)</label>
                <input id="password" autocomplete="new-password" required minlength="8" maxlength="120" class="input" type="password" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''" th:field="*{password}" placeholder="m�nimo de 8 caracteres" th:attr="aria-invalid=${#fields.hasErrors('password')},aria-describedby=${#fields.hasErrors('password')} ? 'register-password-error' : null">
                <span id="register-password-error" class="form-field__error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </div>
            <button class="btn btn-primary btn-full" type="submit">Criar conta</button>
        </form>

        <p class="auth-footer-link">J� tem conta? <a th:href="@{/login}">Entrar</a></p>
    </section>
</div>
</html>
