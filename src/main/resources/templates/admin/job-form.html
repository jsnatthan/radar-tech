<!DOCTYPE html>
<html th:replace="~{fragments/layout :: shell('Nova vaga', ~{::div})}" xmlns:th="http://www.thymeleaf.org">
<div class="container admin-shell">
    <th:block th:replace="~{fragments/admin-nav :: adminNav}"></th:block>

    <div class="page-header">
        <div>
            <h1>Nova vaga</h1>
            <p class="u-muted">Crie uma vaga diretamente como publicada.</p>
        </div>
        <a class="btn btn-outline" th:href="@{/admin/vagas}">Voltar</a>
    </div>

    <section class="card admin-form-card">
        <form class="js-loading-submit" th:action="@{/admin/vagas/nova}" th:object="${form}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="alert alert-error u-mb-4" role="alert" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}">Erro</div>

            <div class="form-field-row">
                <div class="form-field">
                    <label for="af-title">Cargo</label>
                    <input id="af-title" class="input" th:field="*{title}" th:attr="aria-invalid=${#fields.hasErrors('title')},aria-describedby=${#fields.hasErrors('title')} ? 'admin-title-error' : null">
                <span id="admin-title-error" class="form-field__error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
                </div>
                <div class="form-field">
                    <label for="af-company">Empresa</label>
                    <input id="af-company" class="input" th:field="*{company}" th:attr="aria-invalid=${#fields.hasErrors('company')},aria-describedby=${#fields.hasErrors('company')} ? 'admin-company-error' : null">
                <span id="admin-company-error" class="form-field__error" th:if="${#fields.hasErrors('company')}" th:errors="*{company}"></span>
                </div>
            </div>

            <div class="form-field">
                <label for="af-email">E-mail da empresa</label>
                <input id="af-email" class="input" th:field="*{companyEmail}" th:attr="aria-invalid=${#fields.hasErrors('companyEmail')},aria-describedby=${#fields.hasErrors('companyEmail')} ? 'admin-companyEmail-error' : null">
                <span id="admin-companyEmail-error" class="form-field__error" th:if="${#fields.hasErrors('companyEmail')}" th:errors="*{companyEmail}"></span>
            </div>

            <div class="form-field-row">
                <div class="form-field">
                    <label for="af-location">Modelo</label>
                    <select id="af-location" class="select" th:field="*{locationType}" data-location-field th:attr="aria-invalid=${#fields.hasErrors('locationType')},aria-describedby=${#fields.hasErrors('locationType')} ? 'admin-locationType-error' : null">
                        <option th:each="type : ${locationTypes}" th:value="${type.name()}" th:text="${type.label}"></option>
                    </select>
                <span id="admin-locationType-error" class="form-field__error" th:if="${#fields.hasErrors('locationType')}" th:errors="*{locationType}"></span>
                </div>
                <div class="form-field" data-city-field>
                    <label for="af-city">Cidade</label>
                    <input id="af-city" class="input" th:field="*{city}" placeholder="Obrigat�ria para h�brida/presencial" th:attr="aria-invalid=${#fields.hasErrors('city')},aria-describedby=${#fields.hasErrors('city')} ? 'admin-city-error' : null">
                <span id="admin-city-error" class="form-field__error" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></span>
                    <span class="form-field__hint" data-city-hint>Obrigat�rio para vagas h�bridas ou presenciais.</span>
                </div>
            </div>

            <div class="form-field-row">
                <div class="form-field">
                    <label for="af-seniority">Senioridade</label>
                    <select id="af-seniority" class="select" th:field="*{seniority}" th:attr="aria-invalid=${#fields.hasErrors('seniority')},aria-describedby=${#fields.hasErrors('seniority')} ? 'admin-seniority-error' : null">
                        <option th:each="item : ${seniorities}" th:value="${item.name()}" th:text="${item.label}"></option>
                    </select>
                <span id="admin-seniority-error" class="form-field__error" th:if="${#fields.hasErrors('seniority')}" th:errors="*{seniority}"></span>
                </div>
                <div class="form-field">
                    <label for="af-contract">Contrato</label>
                    <select id="af-contract" class="select" th:field="*{contractType}" th:attr="aria-invalid=${#fields.hasErrors('contractType')},aria-describedby=${#fields.hasErrors('contractType')} ? 'admin-contractType-error' : null">
                        <option th:each="item : ${contractTypes}" th:value="${item.name()}" th:text="${item.label}"></option>
                    </select>
                <span id="admin-contractType-error" class="form-field__error" th:if="${#fields.hasErrors('contractType')}" th:errors="*{contractType}"></span>
                </div>
            </div>

            <div class="form-field">
                <label for="af-salary">Faixa salarial</label>
                <input id="af-salary" class="input" th:field="*{salaryRange}" th:attr="aria-invalid=${#fields.hasErrors('salaryRange')},aria-describedby=${#fields.hasErrors('salaryRange')} ? 'admin-salaryRange-error' : null">
                <span id="admin-salaryRange-error" class="form-field__error" th:if="${#fields.hasErrors('salaryRange')}" th:errors="*{salaryRange}"></span>
            </div>
            <div class="form-field">
                <label for="af-description">Descri��o</label>
                <textarea id="af-description" class="textarea" th:field="*{description}" th:attr="aria-invalid=${#fields.hasErrors('description')},aria-describedby=${#fields.hasErrors('description')} ? 'admin-description-error' : null"></textarea>
                <span id="admin-description-error" class="form-field__error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
            </div>
            <div class="form-field">
                <label for="af-requirements">Requisitos</label>
                <textarea id="af-requirements" class="textarea" th:field="*{requirements}" th:attr="aria-invalid=${#fields.hasErrors('requirements')},aria-describedby=${#fields.hasErrors('requirements')} ? 'admin-requirements-error' : null"></textarea>
                <span id="admin-requirements-error" class="form-field__error" th:if="${#fields.hasErrors('requirements')}" th:errors="*{requirements}"></span>
            </div>
            <div class="form-field">
                <label for="af-apply-url">Link externo</label>
                <input id="af-apply-url" class="input" th:field="*{applyUrl}" th:attr="aria-invalid=${#fields.hasErrors('applyUrl')},aria-describedby=${#fields.hasErrors('applyUrl')} ? 'admin-applyUrl-error' : null">
                <span id="admin-applyUrl-error" class="form-field__error" th:if="${#fields.hasErrors('applyUrl')}" th:errors="*{applyUrl}"></span>
            </div>

            <button class="btn btn-primary" type="submit">Publicar vaga</button>
        </form>
    </section>
</div>
</html>
