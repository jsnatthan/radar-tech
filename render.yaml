services:
  - type: web
    name: radar-tech-ihc
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./docker/Dockerfile.render
    dockerContext: .
    healthCheckPath: /ping
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod,render
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: LITELLM_ENABLED
        value: "false"
      - key: PASSWORD_RESET_EMAIL_ENABLED
        value: "false"
